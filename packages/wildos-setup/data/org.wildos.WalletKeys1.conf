<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Anyone may ask. Every call acts only on the caller's own account, which
     the service learns from the bus (the caller's uid), never from an
     argument, and the key itself goes only to the account that signs in
     automatically, once per boot. -->
<busconfig>
  <policy user="root">
    <allow own="org.wildos.WalletKeys1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.wildos.WalletKeys1" send_interface="org.wildos.WalletKeys1"/>
    <allow send_destination="org.wildos.WalletKeys1" send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
</busconfig>
