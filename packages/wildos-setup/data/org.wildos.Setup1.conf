<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Anyone may ask; the helper checks polkit (org.wildos.setup.policy) on
     every call and refuses everything once setup has finished. -->
<busconfig>
  <policy user="root">
    <allow own="org.wildos.Setup1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.wildos.Setup1" send_interface="org.wildos.Setup1"/>
    <allow send_destination="org.wildos.Setup1" send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
</busconfig>
