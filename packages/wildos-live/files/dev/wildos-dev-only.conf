# The guest agent lets the machine hosting a virtual machine run commands in
# it as root. Wild OS's development tools use it to put rebuilt packages into
# a test VM. It comes only with the live image, and starts
# only when the boot command line asks for it with wildos.dev=1, which the
# start-up menu never does. The installer removes it along with this package.
[Unit]
ConditionKernelCommandLine=wildos.dev=1
