# Wild OS (wildos-settings). Each network's DNS servers, Quad9 over TLS by
# default, come from NetworkManager. Names on the local network are found
# with Avahi, so systemd-resolved does not answer multicast DNS itself, and
# LLMNR, which broadcasts every name looked up, stays off.
[Resolve]
LLMNR=no
MulticastDNS=no
# Only used when no network offers any servers.
FallbackDNS=9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net 2620:fe::fe#dns.quad9.net 2620:fe::9#dns.quad9.net
