# Wild OS network defaults (wildos-settings). Settings > Network and
# internet > Advanced network settings changes them network by network.

[main]
# Lookups go through systemd-resolved, which can encrypt them (DNS over
# TLS). wildos-network gives each new network Quad9 over TLS.
dns=systemd-resolved

[connection-wildos-private-address]
# Private hardware address, as GrapheneOS does it: Wi-Fi shows a new random
# address every time it connects, so no network can recognise this computer
# from one visit or place to the next. Wired networks get a random address
# of their own each, kept between visits, so office ports and home address
# reservations keep working. Settings turns it off network by network.
wifi.cloned-mac-address=random
ethernet.cloned-mac-address=stable
# The computer's name isn't announced to the network either.
ipv4.dhcp-send-hostname=false
ipv6.dhcp-send-hostname=false
# IPv6 uses short-lived addresses for outgoing connections, rather than one
# that stays the same everywhere.
ipv6.ip6-privacy=2
