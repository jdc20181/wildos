# Sorts after Kicksecure's 990-security-misc.conf, which sets swappiness to 1
# to keep memory off the disk. With zram at a higher priority, swapping goes
# to compressed memory first, and anything that overflows lands in the swap
# file inside the encrypted root, so a high value no longer means plain text
# on disk.
vm.swappiness = 100

# zram reads single pages fast, so reading ahead in clusters only wastes work.
vm.page-cluster = 0

# Keep directory and inode caches longer, which keeps Files and app launches
# quick after something big has gone through memory.
vm.vfs_cache_pressure = 50

# Fixed limits instead of a share of RAM, so copying a large file to a slow
# USB stick never builds up gigabytes of pending writes that freeze the desktop.
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864
