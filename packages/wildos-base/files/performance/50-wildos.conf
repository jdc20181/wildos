# Compressed swap in memory, used before the encrypted swap file on disk.
# Pages compress about 3:1 with zstd, so a PC under memory pressure slows
# down gently instead of stalling on disk.
# A drop-in, because systemd-zram-generator ships zram-generator.conf itself.
[zram0]
zram-size = min(ram / 2, 8192)
compression-algorithm = zstd
swap-priority = 100
