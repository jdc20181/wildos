# Kicksecure replaces /etc/issue with its own banner, which names Kicksecure and
# gives login instructions that are wrong for Wild OS. Point the text consoles
# at the Wild OS banner instead.
[Service]
ExecStart=
ExecStart=-/sbin/agetty --issue-file /etc/issue.wildos -o '-p -- \u' --noclear - $TERM
