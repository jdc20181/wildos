# When an app has been starved of memory for 20 seconds, systemd-oomd closes
# the app causing it instead of letting the whole PC freeze. Each app runs in
# its own scope under the user's session, so only that app goes. Windows mode
# runs outside the session and is not touched.
[Service]
ManagedOOMMemoryPressure=kill
ManagedOOMMemoryPressureLimit=60%
