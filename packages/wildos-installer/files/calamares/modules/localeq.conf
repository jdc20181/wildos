---
# No page of its own. The language comes from the boot menu (the system
# starts in it), and the "Before we start" page (welcomeq.qml) sets the time
# zone from the language's country through this module's configuration,
# which localeq.qml hands over. The first start of the installed system lets
# people change both. Calamares' built-in page is
# never loaded; it would fetch online map tiles.
qmlSearch: branding
passThrough: true
# No geoip setting: nothing leaves the computer during the install. This is
# the zone when the language has no country of its own.
region: "Europe"
zone: "London"
adjustLiveTimezone: true
