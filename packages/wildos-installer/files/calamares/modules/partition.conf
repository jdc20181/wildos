---
efi:
  mountPoint: "/boot/efi"
  recommendedSize: 512MiB
  minimumSize: 300MiB
  label: "EFI"

# A swap file rather than a partition: it is inside the encrypted root, and
# resizing it later needs no repartitioning. With a single choice Calamares
# shows no swap menu on the disk page.
userSwapChoices:
  - file
initialSwapChoice: file

# GRUB cannot unlock LUKS2 with Argon2, so /boot stays a small unencrypted
# partition and only the root filesystem is encrypted. The initramfs (dracut)
# asks for the passphrase instead of GRUB, which is faster and allows Argon2id.
luksGeneration: luks2
enableLuksAutomatedPartitioning: true
preCheckEncryption: true
# The disk password has a page of its own, after this one (encryption.qml).
# Layouts are made encrypted with a placeholder, and when the install starts
# the password stored under this global storage key replaces it, or the
# encryption is taken off if the person chose not to encrypt
# (wildos-disk-page.patch).
luksPassphraseFrom: wildosDiskPassword
showNotEncryptedBootMessage: false

partitionLayout:
  - name: "wildos-boot"
    filesystem: "ext4"
    noEncrypt: true
    mountPoint: "/boot"
    size: 1GiB
  - name: "wildos-root"
    filesystem: "ext4"
    mountPoint: "/"
    size: 100%
    minSize: 20GiB

initialPartitioningChoice: erase
# A new partition table is GPT, also on BIOS computers, where Wild OS's
# Calamares adds the 1 MiB bios_grub partition GRUB needs
# (wildos-bios.patch). Installing alongside keeps the table the disk has:
# BIOS Windows uses MBR, and Wild OS then goes in an extended partition if
# the four primary ones would not be enough.
defaultPartitionTableType: gpt
defaultFileSystemType: "ext4"
# One entry, so the disk page shows no filesystem menu for the automatic
# choices. Manual partitioning still offers every filesystem.
availableFileSystemTypes: [ "ext4" ]
drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: true
