---
extraMounts:
  - device: proc
    fs: proc
    mountPoint: /proc
  - device: sys
    fs: sysfs
    mountPoint: /sys
  - device: /dev
    mountPoint: /dev
    options: [ bind ]
  - device: /dev/pts
    mountPoint: /dev/pts
    options: [ bind ]
  - device: tmpfs
    fs: tmpfs
    mountPoint: /run
  - device: /run/udev
    mountPoint: /run/udev
    options: [ bind ]
  - device: efivarfs
    fs: efivarfs
    mountPoint: /sys/firmware/efi/efivars
    efi: true

# The Btrfs root (docs/recovery-design.md). Only @ is the system, which
# restore points snapshot; everything that must not go back with it has a
# subvolume of its own: personal files, the restore points, logs, caches,
# temporary files, Windows mode (its disk, firmware variables, TPM state
# and saved memory) and the reset copy. Calamares adds @swap at /swap for
# the swap file, and turns copy-on-write off for that file itself.
# shellprocess@nocow turns it off for @winmode and @libvirt before anything
# is copied in.
btrfsSubvolumes:
  - mountPoint: /
    subvolume: /@
  - mountPoint: /home
    subvolume: /@home
  - mountPoint: /.snapshots
    subvolume: /@snapshots
  - mountPoint: /var/log
    subvolume: /@log
  - mountPoint: /var/cache
    subvolume: /@cache
  - mountPoint: /var/tmp
    subvolume: /@tmp
  - mountPoint: /var/lib/wildos/winmode
    subvolume: /@winmode
  - mountPoint: /var/lib/libvirt
    subvolume: /@libvirt
  - mountPoint: /var/lib/wildos/reset
    subvolume: /@reset
btrfsSwapSubvol: /@swap

# Calamares 3.3 takes mount options here, for the install and for fstab.
# zstd level 1 compresses system files by about a third at no cost a
# person notices.
mountOptions:
  - filesystem: default
    options: [ defaults, noatime ]
  - filesystem: btrfs
    options: [ defaults, noatime, compress=zstd:1 ]
    ssdOptions: [ discard=async ]
  - filesystem: btrfs_swap
    options: [ defaults, noatime ]
  - filesystem: ext4
    options: [ defaults, noatime ]
