---
# The page is branding/wildos/welcomeq.qml, Before we start in the design.
# These checks block the install outright; the Windows ones (BitLocker, Fast
# Startup, free space in Windows) come from check-computer and block only
# installing alongside Windows.
qmlSearch: both

showSupportUrl: false
showKnownIssuesUrl: false
showReleaseNotesUrl: false
showDonateUrl: false

# No internet check: it would contact a server before anyone agreed to it,
# and installing does not need the internet.
requirements:
  requiredStorage: 40
  requiredRam: 2.0
  check:
    - storage
    - ram
    - power
    - root
  required:
    - storage
    - ram
    - root
