---
# Right after mount, before anything is copied: no copy-on-write for the
# subvolumes that hold Windows mode's disk images and firmware state, which
# would otherwise fragment badly and double every write. Nothing to do on a
# root that is not Btrfs.
dontChroot: true
timeout: 30
script:
  - command: "/usr/libexec/wildos/install-nocow ${ROOT}"
    timeout: 30
i18n:
  name: "Preparing the disk"
