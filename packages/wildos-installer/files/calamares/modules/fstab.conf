---
mountOptions:
  default: defaults,noatime
  btrfs: defaults,noatime,compress=zstd
ssdExtraMountOptions:
  ext4: discard
  xfs: discard
  btrfs: discard=async
# dracut unlocks the root with systemd-cryptsetup, which has no keyscript
# support, so the Debian default of keyscript=/bin/cat must not be used.
crypttabOptions: luks,discard
