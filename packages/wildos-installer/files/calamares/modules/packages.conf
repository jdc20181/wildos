---
backend: apt
skip_if_no_internet: false
update_db: false
update_system: false
# Only packages nothing else depends on. Calamares follows every removal with
# apt autoremove, so removing a shared dependency (x11-xserver-utils is needed
# by Plasma) cascades into purging the desktop and the security layer.
# finalize-target checks for exactly that. wildos-setup (first-boot setup)
# must stay: wildos-desktop depends on it, so autoremove leaves it, and
# finalize-target refuses to finish without it.
#
# The boot loader parts came in with the live boot parts, so apt counts them
# as automatic and the autoremove after the removal would take them:
# grub-common (grub-efi-amd64-bin then fails to configure), efibootmgr (only
# recommended, so the pool install never brings it back), and os-prober,
# mokutil and ucf, kept today only by what happens to be installed. They are
# all in the target already, so installing them only marks them as wanted:
# nothing is downloaded.
operations:
  - install:
      - grub-common
      - efibootmgr
      - mokutil
      - os-prober
      - ucf
  - remove:
      - wildos-live
      - wildos-installer
      - calamares
      - dracut-live
