---
# The reset copy: this USB stick's system image, kernel and boot packages,
# kept on the new system (inside the encryption) for Reset Wild OS and
# start-up recovery. About 2 GB. A copy that cannot be verified against the
# release signature is kept but not used (docs/recovery-design.md).
dontChroot: true
timeout: 900
script:
  - command: "/usr/libexec/wildos/reset-copy from-media /run/initramfs/live ${ROOT}"
    timeout: 900
i18n:
  name: "Keeping a copy of Wild OS for resets"
