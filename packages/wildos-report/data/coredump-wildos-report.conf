# After systemd-coredump records a crash, leave a note for the account
# whose program it was, so Report a problem can offer itself. The "+" runs
# the helper outside the coredump service's sandbox, which forbids writing
# to /run/user; the helper drops to the account before writing there.
[Service]
ExecStopPost=+/usr/libexec/wildos/report-crash-note %n
