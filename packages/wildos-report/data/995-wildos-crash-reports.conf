# Crashes go to systemd-coredump again, so Wild OS can tell you when an app
# closed unexpectedly and offer Report a problem. security-misc points
# crashes at /bin/false (990-security-misc.conf), and this file sorts after
# it. Its other protections stay: no core file is ever written (Storage=none
# in its coredump.conf.d) and the core size limit stays 0, so
# systemd-coredump records only which program crashed, the signal and the
# time, never the program's memory. fs.suid_dumpable stays 0.
kernel.core_pattern=|/usr/lib/systemd/systemd-coredump %P %u %g %s %t %c %h %d %F
