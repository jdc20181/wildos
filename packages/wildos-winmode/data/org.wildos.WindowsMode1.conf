<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Only root runs the Windows mode system service. Anyone may call it;
     each method asks polkit (org.wildos.winmode.use) before acting. -->
<busconfig>
  <policy user="root">
    <allow own="org.wildos.WindowsMode1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.wildos.WindowsMode1" send_interface="org.wildos.WindowsMode1.Host"/>
    <allow send_destination="org.wildos.WindowsMode1" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.wildos.WindowsMode1" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
