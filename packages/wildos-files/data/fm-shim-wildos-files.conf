# security-misc's fm-shim answers org.freedesktop.FileManager1 on behalf of
# PCManFM-Qt, which would open a file it was asked to show. Files takes that
# name itself and only ever shows locations in their folder, from local paths
# that exist, so the shim stands aside while Files provides the service. With
# Files removed, this file goes with it and the shim returns at the next
# sign-in.
[Unit]
ConditionPathExists=!/usr/share/dbus-1/services/org.wildos.files.FileManager1.service
