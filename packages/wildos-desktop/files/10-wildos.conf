# The Wild OS sign-in screen. InputMethod keeps the on-screen keyboard
# button available.
[Theme]
Current=wildos

# The greeter runs on KWin under Wayland, as first boot setup and the
# desktop do, rather than on an X server: X never came up on the installed
# system's display, leaving a black screen at the first sign-in after setup.
# The layer-shell integration lets the greeter cover every screen.
[General]
InputMethod=qtvirtualkeyboard
DisplayServer=wayland
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell

[Wayland]
CompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1
