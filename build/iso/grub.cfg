# The start menu of the Wild OS USB stick (the UsbMenu artboard). The theme
# and its pictures come from packages/wildos-branding/tools/grub-theme.sh.
#
# The live system reads wildos.mode from the kernel command line:
#   install   straight into the installer, full screen, no desktop first
#   try       the live desktop with the Install launcher
set default=0
set timeout_style=menu
set timeout=8

insmod all_video
insmod gfxterm
insmod gfxmenu
insmod png
# Most screens of the last decade offer one of these; the firmware's own
# preference ("auto") is often 4K, where a 1440x900 design is tiny.
set gfxmode=1920x1080,1920x1200,1600x900,1440x900,1366x768,1280x800,1280x720,1024x768,auto
# Unifont: the console's font for the editor and messages. UEFI GRUB has it
# inside its signed image; legacy BIOS reads it from /boot/grub/fonts.
loadfont unicode
terminal_output gfxterm

search --no-floppy --set=root --label @VOLID@

set theme_dir=($root)/boot/grub/themes/wildos
set theme=$theme_dir/theme.txt
export theme_dir
# GRUB switches from the menu to its console while it loads the kernel. With
# a background picture that console keeps the menu's colour instead of black
# until the boot splash takes over.
background_image $theme_dir/background.png
set color_normal=light-gray/black

set live="root=live:CDLABEL=@VOLID@ rd.live.image rd.live.overlay.overlayfs=1"
set quiet="quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0"
export live quiet

menuentry "Install Wild OS" --class wildos-install {
    linux /live/vmlinuz $live wildos.mode=install $quiet
    initrd /live/initrd.img
}

menuentry "Try Wild OS" --class wildos-try {
    linux /live/vmlinuz $live wildos.mode=try $quiet
    initrd /live/initrd.img
}

# dracut checks the stick against the checksum make-iso.sh implants before
# it mounts anything, then carries on into the live desktop.
menuentry "Check this USB stick" --class wildos-check {
    linux /live/vmlinuz $live rd.live.check wildos.mode=try $quiet
    initrd /live/initrd.img
}

submenu "Advanced" --class wildos-advanced {
    set timeout=-1
    if [ "$grub_platform" = "efi" ]; then
        set theme=$theme_dir/advanced-efi.txt
    else
        set theme=$theme_dir/advanced-pc.txt
    fi

    menuentry "Install with safe graphics" --class wildos-install-safe {
        linux /live/vmlinuz $live wildos.mode=install nomodeset $quiet
        initrd /live/initrd.img
    }

    menuentry "Try with safe graphics" --class wildos-try-safe {
        linux /live/vmlinuz $live wildos.mode=try nomodeset $quiet
        initrd /live/initrd.img
    }

    menuentry "Show start-up messages" --class wildos-messages {
        linux /live/vmlinuz $live wildos.mode=try systemd.show_status=1
        initrd /live/initrd.img
    }

    if [ "$grub_platform" = "efi" ]; then
        menuentry "Firmware settings" --class wildos-firmware {
            fwsetup
        }
    fi
}
